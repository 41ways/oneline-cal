<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한 줄</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🔢</text></svg>">
<style>
:root{
  /* 바탕을 검정이 아니라 짙은 회갈색으로 올렸다. 칸·카드는 바탕보다
     한 단계씩 더 밝게 둬서 "판 위에 놓인 것"이라는 층위가 남게 한다 */
  --bg:#2a2924; --fg:#faf9f5; --dim:#b6b3a7; --line:#484640; --line2:#736f65;
  --ac:#ff7452; --ok:#b3e09a;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center;
  padding:20px; overflow-x:hidden;
}
#app{width:100%; max-width:900px}

/* ── 상단 계기판 */
header{display:flex; gap:28px; align-items:baseline; border-bottom:1px solid var(--line);
  padding-bottom:12px; margin-bottom:34px; flex-wrap:wrap}
.stat{display:flex; flex-direction:column; gap:2px}
.stat b{font:600 20px/1 var(--mono); letter-spacing:-.02em}
.stat span{font-size:10.5px; letter-spacing:.14em; color:var(--dim); text-transform:uppercase}
.stat.goal b{color:var(--ac)}
header .sp{flex:1}
.brand{font:600 13px/1 var(--mono); letter-spacing:.3em; color:var(--dim)}

/* ── 줄 */
#stage{min-height:230px; display:flex; flex-direction:column; justify-content:center; gap:22px;
  transition:min-height .2s}
#stage.idle{min-height:0}
#line{display:flex; gap:6px; justify-content:center; flex-wrap:nowrap}
.slot{
  flex:1 1 0; min-width:0; aspect-ratio:3/4; max-width:82px;
  border:1px solid var(--line); border-radius:3px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  position:relative; transition:border-color .12s, background .12s, transform .12s;
  cursor:default; background:#333128;
}
.slot.full{border-color:var(--line2); background:#403d33}
.slot .g{font:600 13px/1.15 var(--mono); text-align:center; word-break:keep-all; padding:0 3px}
.slot .idx{position:absolute; top:4px; left:5px; font:10px/1 var(--mono); color:#8a8679}
.slot .val{position:absolute; bottom:5px; left:2px; right:2px; text-align:center;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  font:11px/1 var(--mono); color:var(--ac); opacity:0; transition:opacity .1s}
.slot.lit{border-color:var(--ac); background:#54301f; transform:translateY(-3px)}
.slot.lit .val{opacity:1}
.slot.done .val{opacity:.7; color:var(--dim)}
.slot.pick{cursor:pointer; border-style:dashed; border-color:#807c70}
.slot.pick:hover{border-color:var(--ac); border-style:solid; background:#4a2c1f}
.slot.sel{border-color:var(--ok) !important; border-style:solid}
.slot.skipped{opacity:.3}
.slot.idle .val{color:var(--dim)}
/* 같은 카드가 앞칸에 있어 이번 판에 아무 일도 안 하는 칸 */
.slot.spent .g{opacity:.32; text-decoration:line-through; text-decoration-color:var(--ac)}
.slot.spent::after{content:'무효'; position:absolute; top:4px; right:5px;
  font:9px/1 var(--mono); color:var(--ac); opacity:.9}

/* ── 흐르는 값 */
#flow{text-align:center; font:600 34px/1 var(--mono); letter-spacing:-.03em; min-height:40px}
sup{font-size:.58em; vertical-align:.62em; line-height:0; letter-spacing:0; margin-left:.06em}
#flow small{display:block; font:400 12px/1.6 -apple-system,sans-serif; letter-spacing:.1em; color:var(--dim); margin-top:8px}
#flow.win{color:var(--ok)} #flow.lose{color:var(--ac)}

/* ── 하단 패널 */
footer{margin-top:34px; border-top:1px solid var(--line); padding-top:20px; min-height:150px}
.msg{color:var(--dim); font-size:13.5px; text-align:center; margin-bottom:14px}
.msg em{color:var(--fg); font-style:normal}
.cards{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.card{
  width:139px; border:1px solid var(--line2); border-radius:3px; padding:12px 12px 11px;
  background:#39372e; cursor:pointer; text-align:left; color:inherit; font:inherit;
  transition:border-color .12s, background .12s, transform .12s;
}
@media (hover:hover){.card:hover{border-color:var(--ac); background:#4a2c1f; transform:translateY(-2px)}}
.card .g{font:600 17px/1 var(--mono); margin-bottom:7px}
.card .nm{font-size:12px; margin-bottom:5px}
.card .d{font-size:11.5px; line-height:1.5; color:var(--dim)}
.card .r{float:right; font-size:9.5px; letter-spacing:.1em; color:var(--dim)}
.card .warn{display:block; margin-top:8px; padding-top:8px; border-top:1px solid var(--line2);
  font-size:11px; line-height:1.45; color:var(--ac)}
.card.dupe{border-color:var(--ac); border-style:dashed}
/* 고른 카드. 확인을 누르기 전까지는 아직 아무것도 확정되지 않았다 */
.card.sel{border-color:var(--ok); border-style:solid; background:#2f3a2a}
.card.sel::before{content:'선택'; float:left; font:600 9.5px/1 var(--mono);
  letter-spacing:.1em; color:var(--ok); margin-right:6px}
button.act:disabled{opacity:.32; cursor:default}
button.act:disabled:hover{opacity:.32}
.card .r.rare{color:#a9c8ec} .card .r.legend{color:var(--ac)}
.row{display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap}
button.act{
  font:600 13px/1 inherit; letter-spacing:.06em; padding:13px 30px; border-radius:3px;
  border:1px solid var(--fg); background:var(--fg); color:var(--bg); cursor:pointer;
  transition:opacity .12s;
}
button.act:hover{opacity:.82}
button.ghost{background:none; color:var(--fg); border-color:var(--line2)}
button.ghost:hover{border-color:var(--fg); opacity:1}
.held{display:inline-flex; align-items:center; gap:9px; border:1px solid var(--ac); border-radius:3px;
  padding:8px 14px; background:#4a2c1f}
.held .g{font:600 15px/1 var(--mono); color:var(--ac)}
.held .d{font-size:12px; color:var(--dim); max-width:330px}

/* ── 카드 목록 */
#dex{position:fixed; inset:0; background:var(--bg); overflow:auto; padding:34px 20px;
  display:none; z-index:20}
#dex.on{display:block}
#dex .wrap{max-width:900px; margin:0 auto}
#dex h2{font:600 22px/1 -apple-system,sans-serif; margin-bottom:6px}
#dex .sub{color:var(--dim); font-size:12.5px; line-height:1.7; margin-bottom:22px}
#dex .grp{font:600 11px/1 var(--mono); letter-spacing:.18em; color:var(--dim);
  margin:22px 0 10px; padding-bottom:7px; border-bottom:1px solid var(--line)}
#dex .list{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:9px}
#dex .it{border:1px solid var(--line); border-radius:3px; padding:10px 12px; background:#33312a}
#dex .it b{font:600 14px/1 var(--mono); display:inline-block; margin-right:8px}
#dex .it span{font-size:12px}
#dex .it p{font-size:11.5px; line-height:1.5; color:var(--dim); margin-top:6px}
#dex .close{position:sticky; top:0; float:right}

/* ── 순위 */
.ranksec{margin-top:24px; padding-top:18px; border-top:1px solid var(--line)}
.rank table{width:100%; max-width:560px; margin:0 auto; border-collapse:collapse; font-size:13px}
.rank td{padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:baseline}
.rank td.r{width:2.6em; text-align:right; color:var(--dim); font-family:var(--mono)}
.rank td.nm{word-break:break-all}
.rank td.f{width:4.2em; text-align:right; color:var(--dim); white-space:nowrap}
.rank td.t{text-align:right; font-family:var(--mono); white-space:nowrap}
.rank tr.me td{color:var(--ac)}
.rank tr.gap td{text-align:center; color:var(--dim); border:0; padding:2px}
.rank td.d{width:4.6em; color:var(--dim); font-size:11.5px; white-space:nowrap}
.tabs{display:flex; gap:6px; margin:0 0 18px}
.tabs button{font:600 12.5px/1 inherit; padding:9px 16px; border-radius:3px; border:1px solid var(--line2);
  background:none; color:var(--dim); cursor:pointer}
.tabs button.on{border-color:var(--fg); color:var(--fg)}
.namerow{display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; margin:4px 0 12px}
.namerow input{font:inherit; font-size:14px; padding:11px 12px; border-radius:3px; border:1px solid var(--line2);
  background:#23221d; color:var(--fg); width:190px}
.namerow input:focus{outline:none; border-color:var(--ac)}

/* ── 결과 */
pre.share{font:12.5px/1.7 var(--mono); background:#39372e; border:1px solid var(--line2);
  border-radius:3px; padding:14px 16px; white-space:pre-wrap; word-break:break-all;
  color:var(--fg); margin:0 auto 16px; max-width:440px; text-align:left}
.hint{text-align:center; font-size:12px; color:var(--dim); margin-top:14px; line-height:1.75}
/* ── 시작 화면: 값이 왼쪽에서 오른쪽으로 카드를 타고 흐르는 모습 */
.tline{display:flex; gap:6px; justify-content:center; margin:0 auto 24px; max-width:400px}
.tline i{
  flex:1 1 0; max-width:46px; aspect-ratio:3/4; border:1px solid var(--line); border-radius:3px;
  background:#333128; position:relative;
  animation:tin .5s cubic-bezier(.2,.8,.3,1) var(--di) backwards, tflow 3.2s ease-in-out var(--d) infinite;
}
.tline i::after{content:''; position:absolute; left:0; right:0; bottom:6px; height:2px; margin:0 8px;
  background:var(--ac); border-radius:2px; opacity:0; animation:tval 3.2s ease-in-out var(--d) infinite}
@keyframes tin{from{opacity:0; translate:0 10px}}
@keyframes tflow{
  0%,100%{border-color:var(--line); background:#333128; transform:none}
  10%{border-color:var(--ac); background:#54301f; transform:translateY(-4px)}
  28%{border-color:var(--line2); background:#403d33; transform:none}
}
@keyframes tval{0%,100%{opacity:0} 10%{opacity:1} 34%{opacity:.35}}
.title.home h1{font-size:42px; letter-spacing:-.03em; animation:tin .5s cubic-bezier(.2,.8,.3,1) .1s backwards}
.title.home p{animation:tin .5s cubic-bezier(.2,.8,.3,1) .22s backwards}
.row.home button{animation:tin .45s cubic-bezier(.2,.8,.3,1) var(--di) backwards}
@media (prefers-reduced-motion:reduce){.tline i,.tline i::after,.title.home h1,.title.home p,.row.home button{animation:none}}
.title{text-align:center; margin-bottom:26px}
.title h1{font:600 30px/1.2 -apple-system,sans-serif; letter-spacing:-.02em; margin-bottom:10px}
.title p{color:var(--dim); font-size:13.5px; line-height:1.8}
.title p em{color:var(--fg); font-style:normal; font-weight:600}
@media(max-width:560px){
  .slot .g{font-size:10px} .cards{flex-direction:column; align-items:center}
  .card{width:100%; max-width:300px} header{gap:18px} #flow{font-size:26px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stat"><b id="hFloor">—</b><span id="hFloorLbl">층</span></div>
    <div class="stat goal"><b id="hGoal">—</b><span>목표</span></div>
    <div class="stat"><b id="hTotal">0</b><span>총점</span></div>
    <div class="stat"><b id="hLoop">—</b><span>되감기</span></div>
    <div class="sp"></div>
    <div class="brand" id="hMode">한 줄</div>
  </header>
  <div id="stage">
    <div id="line"></div>
    <div id="flow"></div>
  </div>
  <footer id="panel"></footer>
</div>
<div id="dex"><div class="wrap"></div></div>

<!-- 엔진은 버전을 붙여 부른다. Pages 캐시 때문에 새 화면이 옛 엔진을 받으면 깨진다 -->
<script src="engine.js?v=20260911c"></script>
<script>
"use strict";
var E = ENGINE;

/* ── 난수 세 갈래
   offer : 무슨 카드가 나오나 (시드 하나로 고정)
   exec  : 층을 실제로 굴릴 때. 층마다 독립적으로 만든다 —
           미리보기를 몇 번 눌렀는지가 결과를 바꾸면 데일리 비교가 깨진다
   prev  : 미리보기 전용. 결과에 아무 영향이 없다 */
function prevRnd(){ return E.mulberry32(0x9e3779b9); }

var S = null;

function curGoal(){
  if (S.tut) return S.tut.def.goal == null ? null : E.V(S.tut.def.goal);
  return E.targetV(S.floor);
}

/* 데일리 기록은 그날의 첫 판만 남긴다. 다시 못 하게 막지는 않는다 —
   막아봐야 시크릿 창으로 열면 그만이고, 친구끼리 하는 판에서
   기록의 근거는 어차피 서로에 대한 신뢰라서 */
/* 날짜는 판을 시작할 때 정한 것(S.day)을 끝까지 쓴다. 자정을 넘긴 판을
   끝나는 순간의 날짜로 기록하거나 올리면 다음 날 시드로 재생되어 카드가 안 맞는다 */
function recKey(day){ return 'oneline-d' + (day || E.dayNumber()); }
function readRec(day){
  try {
    var r = JSON.parse(localStorage.getItem(recKey(day)) || 'null');
    if (r) r.total = E.vUnpack(r.total);        // 예전 기록은 그냥 수로 들어 있다
    return r;
  } catch(e){ return null; }
}
function writeRec(r, day){
  try { if (!readRec(day)) localStorage.setItem(recKey(day), JSON.stringify(r)); } catch(e){}
}

function newGame(daily){
  var day = daily ? E.dayNumber() : null;
  var seed = daily ? E.seedForDay(day) : (Math.random()*4294967295)>>>0;
  S = {
    tut: null, day: day,
    daily: daily, seed: seed, floor: 1, total: E.V(0),
    /* 한 판 동안 둔 수. 순위 서버는 점수를 믿지 않고 이걸 엔진으로 다시 돌려
       직접 계산한다 — 그래서 여기 없는 수는 없던 일이 된다 */
    moves: { start: [], floors: [] }, stepCur: null,
    line: new Array(E.SLOTS_START).fill(null),
    offer: E.mulberry32(seed),
    queue: E.START_HAND.slice(),   // 놓아야 할 카드 대기줄
    held: null, pick: null, phase: 'place', choices: null,
    swapFrom: -1, lastRes: null
  };
  document.getElementById('stage').classList.remove('idle');
  takeNext();
  render();
}
function takeNext(){
  S.held = S.queue.length ? S.queue.shift() : null;
  S.phase = S.held ? 'place' : 'ready';
}

// ══════════════════════════════════ 표시 도우미
/* 값은 엔진의 { n, L } 쌍이다. 1e15 밑은 정확한 정수, 그 위는 자릿수(L)만 있다.
   한글 단위는 경(1e16)까지만 쓰고 그 위로는 10의 거듭제곱으로.
   거듭제곱 자리는 <sup> 에 보통 숫자로 쓴다 — 예전엔 ³⁰⁰ 같은 위첨자 문자를
   썼는데, ¹²³ 만 대부분의 글꼴에 있고 ⁰⁴⁵…는 없어서 다른 글꼴로 대체되며
   「10³ ⁰ ⁰」처럼 벌어져 보였다(제보 화면). 복사해서 붙이는 글에는 ^ 로 쓴다 */
function toV(x){ return (typeof x === 'number') ? E.V(x) : x; }
function numParts(x){
  x = toV(x);
  if (x.L === -Infinity) return { t:'0' };
  var n = E.vBig(x) ? (x.L < 20 ? Math.pow(10, x.L) : null) : x.n;
  if (n != null){
    if (n >= 1e16) return { t:(n/1e16).toFixed(n/1e16 < 10 ? 2 : 1) + '경' };
    if (n >= 1e12) return { t:(n/1e12).toFixed(n/1e12 < 10 ? 2 : 1) + '조' };
    if (n >= 1e8)  return { t:(n/1e8).toFixed(n/1e8 < 10 ? 2 : 1) + '억' };
    return { t:Math.floor(n).toLocaleString('ko-KR') };
  }
  var e = Math.floor(x.L), m = Math.pow(10, x.L - e);
  if (m.toFixed(2) === '10.00'){ m = 1; e += 1; }
  /* 자릿수 자체가 1e15 를 넘으면 정수로 못 적는다. 이 게임에서 닿을 일은 없지만
     표현 한계(10^(1.8e308))까지 안 깨지게 */
  if (e >= 1e15) return { m:'10', e:x.L.toExponential(2).replace('e+', '×10^') };
  return { m:m.toFixed(2) + '×10', e:(e >= 10000 ? e.toLocaleString('en-US') : String(e)) };
}
function fmt(x){                      // 화면용 HTML
  var p = numParts(x);
  return p.t != null ? p.t : p.m + '<sup>' + p.e + '</sup>';
}
/* 칸 밑의 작은 숫자. 폭이 좁아 10^1,134,704,516 같은 건 칸 밖으로 넘친다.
   거듭제곱 자리가 만 단위를 넘으면 만·억·조로 줄이고 앞자리는 뺀다 */
function fmtS(x){
  var p = numParts(x);
  if (p.t != null) return p.t;
  var e = Math.floor(toV(x).L);
  if (e < 10000) return fmt(x);
  var c = e >= 1e12 ? (e/1e12).toFixed(1) + '조' : e >= 1e8 ? (e/1e8).toFixed(1) + '억' : (e/1e4).toFixed(e < 1e5 ? 1 : 0) + '만';
  return '10<sup>' + c + '</sup>';
}
function fmtT(x){                     // 복사·제목용 글자
  var p = numParts(x);
  return p.t != null ? p.t : p.m + '^' + p.e;
}
/* 목표에 얼마나 못 미쳤나. 값이 커지면 뺄셈이 무의미해진다 —
   9.35×10²⁸ 목표에 5.85×10²⁴ 점이면 차이도 9.35×10²⁸ 이라
   "9.35×10²⁸ 모자랍니다"가 목표를 그대로 되뇌는 꼴이 된다.
   열 배 넘게 벌어지면 배수로 말한다. 자릿수로 계산하니 목표가 아무리 커도 된다 */
function shortText(v, goal){
  v = toV(v); goal = toV(goal);
  var dL = goal.L - (v.L === -Infinity ? 0 : v.L);
  if (dL < 1) return fmt(E.vFromL(goal.L + Math.log10(1 - Math.pow(10, -dL)))) + ' 모자랍니다';
  return fmt(E.vFromL(dL)) + '배 모자랍니다';
}
function ge(a, b){ return E.vCmp(toV(a), toV(b)) >= 0; }

function el(tag, cls, txt){
  var d = document.createElement(tag);
  if (cls) d.className = cls;
  if (txt != null) d.textContent = txt;
  return d;
}
function cardBtn(id, onClick){
  var c = E.CARDS[id];
  var b = el('button','card');
  var at = S && S.line ? E.haveIn(S.line, id) : -1;
  b.innerHTML = '<span class="r ' + c.r + '">' + E.RARITY[c.r] + '</span>' +
                '<div class="g">' + c.g + '</div>' +
                '<div class="nm">' + c.n + '</div>' +
                '<div class="d">' + c.d + '</div>' +
                (at >= 0
                  ? '<span class="warn">⚠ 이미 ' + (at+1) + '번 칸에 있습니다.<br>' +
                    '같은 카드는 <b>더 앞의 것만</b> 발동합니다 — 뒤에 놓으면 아무 일도 안 하고, ' +
                    (at+1) + '번 칸보다 앞에 놓으면 그쪽이 대신 무효가 됩니다.</span>'
                  : '');
  if (at >= 0) b.classList.add('dupe');
  b.onclick = onClick;
  return b;
}

// ══════════════════════════════════ 그리기
function render(){
  var goal = curGoal();
  document.getElementById('hFloor').textContent = S.tut ? (S.tut.i+1) + '/' + TUT.length : S.floor;
  document.getElementById('hFloorLbl').textContent = S.tut ? '단계' : '층';
  document.getElementById('hGoal').innerHTML  =
    (goal == null || (S.tut && S.tut.def.always)) ? '—' : fmt(goal);
  document.getElementById('hMode').textContent  =
    S.tut ? '튜토리얼' : (S.daily ? '데일리 #' + S.day : '자유');
  document.getElementById('hTotal').innerHTML = S.tut ? '—' : fmt(S.total);
  document.getElementById('hLoop').textContent  = S.tut ? (S.tut.def.loops || '—') : E.loopBudgetFor(S.floor);

  drawLine();
  drawFlow();
  drawPanel();
}

function drawLine(){
  var wrap = document.getElementById('line');
  wrap.innerHTML = '';
  for (var i=0;i<S.line.length;i++){
    (function(i){
      var c = S.line[i];
      var s = el('div','slot' + (c ? ' full' : ''));
      s.appendChild(el('span','idx', i+1));
      s.appendChild(el('div','g', c ? E.CARDS[c.id].g : ''));
      s.appendChild(el('div','val',''));
      if (c) s.title = E.CARDS[c.id].n + ' — ' + E.CARDS[c.id].d;
      if (c && E.mutedAt(S.line, i)){
        s.classList.add('spent');
        s.title += '\n⚠ 같은 카드가 앞칸에 있습니다. 앞의 것만 발동하고 이 칸은 아무 일도 안 합니다';
      }

      if (S.phase === 'place'){
        s.classList.add('pick');
        s.onclick = function(){ placeHeld(i); };
        s.onmouseenter = function(){ previewAt(i); };
        s.onmouseleave = function(){ drawFlow(); };
        // 손가락에는 mouseenter 가 없다. 그대로 두면 휴대폰에서는 미리보기를 아예 못 본다.
        // 누르고 있는 동안 미리 보여 주고, 떼면 원래대로 돌린다.
        s.onpointerdown = function(e){ if (e.pointerType !== 'mouse') previewAt(i); };
        s.onpointercancel = function(){ drawFlow(); };
      } else if (S.phase === 'repair'){
        s.classList.add('pick');
        if (S.swapFrom === i) s.classList.add('sel');
        s.onclick = function(){ doSwap(i); };
      }
      wrap.appendChild(s);
    })(i);
  }
}

function drawFlow(txt, cls, sub){
  var f = document.getElementById('flow');
  f.className = cls || '';
  f.innerHTML = '';
  if (txt == null){
    if (S.phase === 'over' || S.phase === 'anim') return;   // 끝난 판을 다시 계산해 덮지 않음
    if (S.tut && S.phase !== 'place' && S.phase !== 'ready') return;
    var v = E.expectedV(S.line, prevRnd(), 9, S.floor);
    var goal = curGoal();
    var au = E.loopAudit(S.line, S.floor);
    f.innerHTML = fmt(v) + '<small>' +
      (ge(v, goal) ? '지금 배치로 통과' : '목표까지 ' + shortText(v, goal)) +
      (au.over ? '  ·  ⚠ 되감기 카드 ' + au.cards + '장 / 쓸 수 있는 건 ' + au.budget + '번' : '') +
      '</small>';
    f.className = ge(v, goal) ? 'win' : '';
  } else {
    f.innerHTML = txt + (sub ? '<small>' + sub + '</small>' : '');
  }
}

function previewAt(i){
  var keep = S.line[i];
  S.line[i] = { id: S.held };
  var v = E.expectedV(S.line, prevRnd(), 9, S.floor);
  S.line[i] = keep;
  var goal = curGoal();
  S.line[i] = { id: S.held };
  var spent = E.mutedAt(S.line, i);
  S.line[i] = keep;
  drawFlow(fmt(v), ge(v, goal) ? 'win' : '',
    (spent ? '⚠ 같은 카드가 앞칸에 있어 이 칸은 무효 · ' : '') +
    (keep ? E.CARDS[keep.id].n + ' 을(를) 덮어씀 · ' : '') +
    (ge(v, goal) ? '통과' : '목표까지 ' + shortText(v, goal)));
}

function drawPanel(){
  var p = document.getElementById('panel');
  p.innerHTML = '';
  if (S.tut){ tutPanel(p); return; }

  if (S.phase === 'place'){
    var c = E.CARDS[S.held];
    var m = el('div','msg');
    m.innerHTML = '카드를 놓을 칸을 고르세요. <em>이미 찬 칸에 놓으면 덮어씁니다 — ' +
                  '그게 이 게임에서 카드를 지우는 유일한 방법입니다.</em>';
    p.appendChild(m);
    var row = el('div','row');
    var h = el('div','held');
    h.innerHTML = '<span class="g">' + c.g + '</span>' +
                  '<span class="d"><b>' + c.n + '</b> — ' + c.d + '</span>';
    row.appendChild(h);
    p.appendChild(row);

  } else if (S.phase === 'ready'){
    p.appendChild(el('div','msg','줄이 준비됐습니다. 실행하면 값이 왼쪽에서 오른쪽으로 흐릅니다.'));
    var r = el('div','row');
    var b = el('button','act','실 행');
    b.onclick = execute;
    r.appendChild(b);
    p.appendChild(r);

  } else if (S.phase === 'reward'){
    /* 카드를 누르는 것과 확정하는 것을 갈라놨다. 한 번 고르면 그 카드를 어디에
       놓을지까지 이어지는데, 그 앞에서 잘못 눌러 되돌릴 수 없게 되면 억울하다.
       고른 뒤에도 다른 카드 설명을 다시 읽어볼 수 있어야 해서 목록은 그대로 둔다 */
    var m3 = el('div','msg');
    var lb = E.loopBudgetFor(S.floor), lbPrev = E.loopBudgetFor(S.floor - 1);
    m3.innerHTML = S.floor + '층 보상 — ' + E.CHOICES + '장 중 한 장을 고르고 <em>확인</em>을 누르세요.' +
      (lb > lbPrev
        ? (S.floor === E.TARGETS.length + 1
            ? '<br><em>무한 모드 — 이번 층부터 되감기 ' + lb + '번.</em> 이번 한 번은 덤이고, ' +
              '앞으로 ' + E.LOOP_STEP + '층마다 한 번씩 늘 때는 목표도 같이 뜁니다.'
            : '<br><em>이번 층부터 되감기 ' + lb + '번.</em> 목표도 같이 뜁니다 — 늘어난 되감기를 제곱에 걸어야 따라갑니다.')
        : '');
    p.appendChild(m3);

    var cs = el('div','cards');
    S.choices.forEach(function(id){
      var b = cardBtn(id, function(){
        S.pick = (S.pick === id) ? null : id;      // 다시 누르면 선택 해제
        drawPanel();
      });
      if (S.pick === id) b.classList.add('sel');
      cs.appendChild(b);
    });
    p.appendChild(cs);

    var dr = el('div','row'); dr.style.marginTop = '18px';
    var okb = el('button','act', S.pick ? '「' + E.CARDS[S.pick].n + '」으로 확인' : '카드를 고르세요');
    okb.disabled = !S.pick;
    okb.onclick = function(){
      if (!S.pick) return;
      S.held = S.pick; S.pick = null; S.phase = 'place';
      render();
    };
    var db = el('button','act ghost','카드 목록');
    db.onclick = openDex;
    dr.appendChild(okb); dr.appendChild(db);
    p.appendChild(dr);

  } else if (S.phase === 'repair'){
    var m2 = el('div','msg');
    m2.innerHTML = '<em>정비</em> — 두 칸을 골라 맞바꿀 수 있습니다. 이번 한 번뿐입니다.';
    p.appendChild(m2);
    var r2 = el('div','row');
    var sk = el('button','act ghost','그냥 넘어가기');
    sk.onclick = function(){ S.swapFrom = -1; afterRepair(); };
    r2.appendChild(sk);
    p.appendChild(r2);

  } else if (S.phase === 'over'){
    drawOver(p);
  }
}

// ══════════════════════════════════ 진행
function placeHeld(i){
  if (!S.tut && S.moves){
    if (S.stepCur){ S.stepCur.pick = S.held; S.stepCur.slot = i; S.moves.floors.push(S.stepCur); S.stepCur = null; }
    else S.moves.start.push(i);
  }
  S.line[i] = { id: S.held };
  S.held = null;
  if (S.tut){                       // 튜토리얼은 놓자마자 알아서 굴린다
    S.phase = 'ready'; render();
    setTimeout(execute, 420);
    return;
  }
  takeNext();
  render();
}

function execute(){
  S.phase = 'anim';
  drawLine();
  document.getElementById('panel').innerHTML = '';
  var res = E.run(S.line, S.tut ? E.mulberry32(4242) : E.execRnd(S.seed, S.floor), S.floor);
  S.lastRes = res;
  playTrace(res, function(){ S.tut ? tutFinish(res) : finishFloor(res); });
}

/* 값이 칸을 하나씩 통과하는 걸 그대로 보여준다. 되감기가 걸리면
   인덱스가 뒤로 가는 게 화면에 그냥 보이는데, 그게 제일 좋은 설명이라 따로 안 꾸민다 */
function playTrace(res, done){
  var slots = document.querySelectorAll('#line .slot');
  var t = res.trace, k = 0;
  drawFlow(fmt(E.START_VALUE), '', '흐름 시작');
  var step = function(){
    if (k >= t.length){
      setTimeout(function(){ done(); }, 380);
      return;
    }
    var ev = t[k++];
    for (var j=0;j<slots.length;j++) slots[j].classList.remove('lit');
    var s = slots[ev.i];
    if (!s){ step(); return; }
    s.classList.add('lit','done');
    var v = s.querySelector('.val');
    if (ev.skipped){ s.classList.add('skipped'); v.textContent = '건너뜀'; }
    else if (ev.muted){ s.classList.add('skipped'); v.textContent = '무효'; }
    else if (ev.idle){ s.classList.add('idle'); v.textContent = '그대로'; }
    else { s.classList.remove('idle'); v.innerHTML = fmtS(ev.to); }
    drawFlow(fmt(ev.to), '', (ev.i+1) + '번 칸 · ' + E.CARDS[ev.id].n);
    setTimeout(step, Math.max(22, Math.min(190, Math.floor(4200 / t.length))));
  };
  setTimeout(step, 320);
}

function finishFloor(res){
  var goal = E.targetV(S.floor);
  var slots = document.querySelectorAll('#line .slot');
  for (var j=0;j<slots.length;j++) slots[j].classList.remove('lit');

  /* 못 넘은 층에서 낸 점수도 총점에 들어간다. 총점은 사실상 마지막 몇 층이
     정하는데, 같은 층에서 멈춘 사람끼리는 그 마지막 한 번이 순위를 가른다 */
  E.vAdd(S.total, res.v);
  if (!E.passes(res.v, S.floor)){
    document.getElementById('hTotal').innerHTML = fmt(S.total);
    drawFlow(fmt(res.v), 'lose', '목표 ' + fmt(goal) + ' — ' + shortText(res.v, goal));
    S.phase = 'over';
    drawPanel();
    return;
  }
  S.stepCur = { swap:null, pick:null, slot:-1 };   // 이 층을 넘긴 뒤 둘 수를 모은다
  drawFlow(fmt(res.v), 'win', S.floor + '층 통과 · 목표 ' + fmt(goal));

  var grew = E.SLOT_GAIN_ON.indexOf(S.floor) >= 0 && S.line.length < E.SLOTS_MAX;
  if (grew) S.line.push(null);

  var repair = E.REPAIR_ON.indexOf(S.floor) >= 0;
  setTimeout(function(){
    document.getElementById('hTotal').innerHTML = fmt(S.total);
    if (repair){ S.phase = 'repair'; S.swapFrom = -1; render(); }
    else afterRepair();
  }, 900);
}

function doSwap(i){
  if (S.swapFrom < 0){ S.swapFrom = i; drawLine(); return; }
  if (S.swapFrom === i){ S.swapFrom = -1; drawLine(); return; }
  var a = S.line[S.swapFrom];
  S.line[S.swapFrom] = S.line[i];
  S.line[i] = a;
  if (S.stepCur) S.stepCur.swap = [S.swapFrom, i];
  S.swapFrom = -1;
  afterRepair();
}

function afterRepair(){
  S.floor++;
  S.choices = E.rollChoices(S.floor, S.offer, E.CHOICES);
  S.pick = null;
  S.phase = 'reward';
  render();
}

// ══════════════════════════════════ 결과
function lineText(){
  return S.line.map(function(c){ return c ? E.CARDS[c.id].g : '·'; }).join(' ');
}
function shareText(){
  return '한 줄 ' + (S.daily ? '#' + S.day : '자유 ' + S.seed.toString(36)) + '\n' +
         (S.floor-1) + '층 통과 · 총점 ' + fmtT(S.total) + '\n' +
         lineText();
}
function drawOver(p){
  var reached = S.floor - 1;
  /* 결과 화면이 다시 그려져도 "오늘 첫 판인가"가 바뀌면 안 된다.
     예전엔 두 번째로 그릴 때 방금 쓴 기록을 읽고 "이번 판은 연습"이라 했다 */
  if (S.daily && S.firstRec === undefined){
    S.firstRec = readRec(S.day);
    writeRec({ floor:reached, total:E.vPack(S.total), line:lineText() }, S.day);
  }
  var first = S.daily ? S.firstRec : null;
  /* 머리의 층 표시는 "지금 도전 중인 층"이라 못 넘은 층(예: 28)이 떠 있다.
     예전엔 여기서 "27층에서 멈췄습니다"라고 해서 숫자가 서로 안 맞아 보였다 */
  var m = el('div','msg');
  m.innerHTML = '<em>' + S.floor + '층에서 멈췄습니다</em> — ' + reached + '층까지 통과, 총점 ' + fmt(S.total) +
                ' <span style="color:var(--dim)">(멈춘 층 점수 포함)</span>';
  p.appendChild(m);

  var pre = el('pre','share', shareText());
  p.appendChild(pre);

  var r = el('div','row');
  var cp = el('button','act','결과 복사');
  cp.onclick = function(){
    navigator.clipboard.writeText(shareText()).then(function(){
      cp.textContent = '복사됨';
      setTimeout(function(){ cp.textContent = '결과 복사'; }, 1400);
    });
  };
  r.appendChild(cp);
  var again = el('button','act ghost', S.daily ? '자유 모드로 한 판 더' : '한 판 더');
  again.onclick = function(){ newGame(false); };
  r.appendChild(again);
  p.appendChild(r);

  var h = el('div','hint');
  h.innerHTML = S.daily
    ? (first
        ? '오늘 기록은 이미 <b style="color:var(--fg)">' + first.floor + '층 통과 · ' +
          fmt(first.total) + '</b>으로 남아 있습니다. 이번 판은 연습입니다.'
        : '오늘의 시드는 모두 같습니다. 같은 카드가 같은 순서로 나왔으니, 차이는 어디에 뒀느냐뿐입니다.')
    : '자유 모드는 매번 다른 시드로 돕니다. 기록 비교는 데일리로 하세요.';
  p.appendChild(h);

  var sec = rankSection(first);
  if (sec) p.appendChild(sec);
}

    fail: '되감기가 앞에 있으면 되돌릴 구간 자체가 없습니다. 반복시키고 싶은 것 뒤에 두세요.'
  },
  {
    end: true,
    text: '끝입니다. 본편에서는 이렇게 이어집니다.<br><br>' +
          '층을 넘길 때마다 카드 <em>3장 중 1장</em>을 골라 어느 칸에든 놓습니다.<br>' +
          '칸은 2·4·6·8·10층에서 하나씩 늘고, 3·6·9층에는 <em>정비</em>로 두 칸을 맞바꿀 수 있습니다.<br>' +
          '목표는 층마다 가파르게 오릅니다 — 20, 40, 130, <em>1,300</em>, 4,500 …<br>' +
          '8층을 넘으면 무한 모드 — 3층마다 <em>되감기가 한 번씩 늘고</em> 목표도 같이 뜁니다.<br><br>' +
          '<em>그리고 여기서 놓은 카드는 되돌릴 수 없습니다.</em>'
  }
];

function startTut(){
  document.getElementById('stage').classList.remove('idle');
  S = { tut:null, daily:false, seed:0, floor:1, total:0, line:[], held:null,
        pick:null, phase:'place', choices:null, swapFrom:-1, lastRes:null };
  loadStep(0);
}

function loadStep(i){
  var d = TUT[i];
  S.tut = { i:i, def:d };
  if (d.end){
    S.line = [];
    S.phase = 'end';
    document.getElementById('stage').classList.add('idle');
    render();
    return;
  }
  document.getElementById('stage').classList.remove('idle');
  S.line = d.line.map(function(x){ return x ? { id:x } : null; });
  S.held = d.card || null;
  S.phase = S.held ? 'place' : 'ready';
  render();
}

function tutFinish(res){
  var slots = document.querySelectorAll('#line .slot');
  for (var j=0;j<slots.length;j++) slots[j].classList.remove('lit');
  var d = S.tut.def;
  var ok = d.always || ge(res.v, d.goal);
  S.phase = ok ? 'pass' : 'fail';
  drawFlow(fmt(res.v), d.always ? '' : (ok ? 'win' : 'lose'),
    d.always ? '무효인 칸은 아무 일도 하지 않습니다'
             : (ok ? '목표 ' + fmt(d.goal) + ' 통과'
                   : '목표 ' + fmt(d.goal) + ' — ' + shortText(res.v, d.goal)));
  drawPanel();
}

function tutPanel(p){
  var d = S.tut.def;

  if (S.phase === 'end'){
    var t = el('div','title');
    t.innerHTML = '<h1>준비됐습니다</h1><p>' + d.text + '</p>';
    p.appendChild(t);
    var re = el('div','row');
    var a = el('button','act','오늘의 판');
    a.onclick = function(){ newGame(true); };
    var b = el('button','act ghost','자유 모드');
    b.onclick = function(){ newGame(false); };
    var c = el('button','act ghost','튜토리얼 다시');
    c.onclick = startTut;
    re.appendChild(a); re.appendChild(b); re.appendChild(c);
    p.appendChild(re);
    return;
  }

  var m = el('div','msg');
  m.innerHTML = (S.phase === 'fail' ? d.fail : (S.phase === 'pass' ? d.pass : d.text));
  p.appendChild(m);

  var r = el('div','row');
  if (S.phase === 'place'){
    var c2 = E.CARDS[S.held];
    var h = el('div','held');
    h.innerHTML = '<span class="g">' + c2.g + '</span>' +
                  '<span class="d"><b>' + c2.n + '</b> — ' + c2.d + '</span>';
    r.appendChild(h);
  } else if (S.phase === 'ready'){
    var run = el('button','act','실 행');
    run.onclick = execute;
    r.appendChild(run);
  } else if (S.phase === 'pass'){
    var nx = el('button','act', S.tut.i === TUT.length-2 ? '마무리' : '다음');
    nx.onclick = function(){ loadStep(S.tut.i + 1); };
    r.appendChild(nx);
  } else if (S.phase === 'fail'){
    var rt = el('button','act','다시 놓기');
    rt.onclick = function(){ loadStep(S.tut.i); };
    r.appendChild(rt);
  }
  p.appendChild(r);

  var sk = el('div','hint');
  var a2 = el('a', null, '튜토리얼 건너뛰기');
  a2.href = 'javascript:void 0';
  a2.style.cssText = 'color:var(--dim); text-decoration:underline; cursor:pointer';
  a2.onclick = function(){ title(); };
  sk.appendChild(a2);
  p.appendChild(sk);
}

// ══════════════════════════════════ 카드 목록
/* 보상에서 뭘 고를지 정하기 전에 전체를 훑어볼 수 있어야 한다.
   후보 넉 장의 설명만 보고 고르라고 하면, 지금 안 나온 카드와 견줄 수가 없다 */
function openDex(){
  var d = document.getElementById('dex'), w = d.querySelector('.wrap');
  w.innerHTML = '';
  var cl = el('button','act ghost close','닫기');
  cl.onclick = function(){ d.classList.remove('on'); };
  w.appendChild(cl);
  w.appendChild(el('h2', null, '카드 ' + E.CARD_IDS.length + '종'));
  var sub = el('div','sub');
  sub.innerHTML = '값은 <b style="color:var(--fg)">1</b>에서 시작해 왼쪽 칸부터 차례로 통과합니다. ' +
    '끝에 남은 값이 그 층의 점수입니다.<br>' +
    '<b style="color:var(--ac)">같은 카드를 두 장 놓으면 더 앞의 것만 발동합니다.</b> ' +
    '뒤의 것은 그 판 내내 아무 일도 하지 않습니다.';
  w.appendChild(sub);

  ['common','uncommon','rare','legend'].forEach(function(r){
    var ids = E.CARD_IDS.filter(function(id){ return E.CARDS[id].r === r; });
    if (!ids.length) return;
    w.appendChild(el('div','grp', E.RARITY[r] + ' · ' + ids.length + '종'));
    var list = el('div','list');
    ids.forEach(function(id){
      var c = E.CARDS[id];
      var it = el('div','it');
      it.innerHTML = '<b>' + c.g + '</b><span>' + c.n + '</span><p>' + c.d + '</p>';
      list.appendChild(it);
    });
    w.appendChild(list);
  });
  d.classList.add('on');
}

// ══════════════════════════════════ 순위
/* 순위 서버는 Cloudflare Worker(oneline-rank, 저장소 rank/ 폴더). 허브 채팅과 따로 논다.
   서버는 점수를 믿지 않고 S.moves 를 엔진으로 다시 돌려 직접 계산한다.
   다른 서버에 붙여 시험하려면 주소 뒤에 ?api=http://localhost:8811 */
var RANK_API = (function(){
  try { var q = new URLSearchParams(location.search).get('api'); if (q) return q.replace(/\/$/, ''); } catch(e){}
  return 'https://oneline-rank.41ways.workers.dev';
})();
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
/* 이름이 아니라 "이 브라우저"를 가리키는 무작위 아이디. 하루 한 줄을 지키는 데만 쓴다 */
function myPid(){
  var p = lsGet('oneline-pid');
  if (!p || !/^[a-z0-9]{8,32}$/.test(p)){
    p = '';
    for (var i=0;i<16;i++) p += 'abcdefghijklmnopqrstuvwxyz0123456789'.charAt(Math.floor(Math.random()*36));
    lsSet('oneline-pid', p);
  }
  return p;
}
var NICK_A = ['느긋한','배고픈','수상한','용감한','졸린','반짝이는','말없는','날쌘','엉뚱한','다정한','씩씩한','꼼꼼한'];
var NICK_B = ['수달','펭귄','너구리','고양이','두더지','참새','고래','판다','오리','여우','다람쥐','문어'];
function randomNick(){
  return NICK_A[Math.floor(Math.random()*NICK_A.length)] + ' ' + NICK_B[Math.floor(Math.random()*NICK_B.length)];
}
function rankFetch(path, opt){
  return fetch(RANK_API + path, opt).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
      return j;
    });
  });
}
/* 날짜 번호 → "9월 11일". engine.dayNumber 가 동네 날짜의 UTC 자정을 셌으니 UTC 로 되읽는다 */
function dayLabel(day){
  var d = new Date(day * 86400000);
  return (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() + '일';
}
function rankRow(r, withDay){
  var tr = el('tr', r.me ? 'me' : '');
  tr.appendChild(el('td', 'r', r.rank));
  if (withDay) tr.appendChild(el('td', 'd', r.day ? dayLabel(r.day) : ''));
  tr.appendChild(el('td', 'nm', r.name + (r.me ? ' (나)' : '')));      // 남이 쓴 글자라 textContent 로만
  tr.appendChild(el('td', 'f', r.floor + '층'));
  var t = el('td', 't');
  t.innerHTML = fmt(E.vUnpack(r.total));
  tr.appendChild(t);
  tr.title = (r.line || []).map(function(id){ return id && E.CARDS[id] ? E.CARDS[id].g : '·'; }).join(' ');
  return tr;
}
function rankTable(b, allTime){
  var wrap = el('div','rank');
  if (!b.rows.length){
    wrap.appendChild(el('div','hint','아직 아무도 안 올렸습니다. 첫 번째가 되세요.'));
    return wrap;
  }
  var t = el('table');
  b.rows.forEach(function(r){ t.appendChild(rankRow(r, allTime)); });
  if (b.mine && !b.rows.some(function(r){ return r.me; })){
    var gap = el('tr','gap'); gap.appendChild(el('td', null, '⋯')).colSpan = allTime ? 5 : 4;
    t.appendChild(gap);
    t.appendChild(rankRow(b.mine, allTime));
  }
  wrap.appendChild(t);
  wrap.appendChild(el('div','hint', allTime
    ? '지금까지 ' + b.count + '명 · 한 사람당 가장 좋은 판 하나 · 날짜마다 카드가 달라서 운이 조금 섞입니다'
    : '오늘 ' + b.count + '명 · 한 사람당 그날 첫 판만 · 줄에 마우스를 올리면 마지막 배치가 보입니다'));
  return wrap;
}
/* 판이 끝난 화면 아래 붙는 순위 칸.
   오늘 첫 판이면 이름을 받아 올린다. 자동으로 올리지 않는 건 — 이름이
   남들 화면에 뜨는 일이라 한 번은 스스로 누르게 하려고 */
function rankSection(first){
  var sec = el('div','ranksec');
  if (!S.daily) return null;
  if (first || S.submitted){ loadBoard(sec, first ? '순위에는 오늘 첫 판만 올라갑니다.' : null, S.day); return sec; }

  var m = el('div','msg');
  m.innerHTML = '오늘 첫 판입니다. <em>순위에 올릴까요?</em>';
  sec.appendChild(m);
  var row = el('div','namerow');
  var inp = document.createElement('input');
  inp.type = 'text'; inp.maxLength = 12; inp.placeholder = '이름 (비우면 아무 별명)';
  inp.value = lsGet('oneline-name') || '';
  var go = el('button','act','이 이름으로 올리기');
  go.onclick = function(){
    var nm = inp.value.trim() || randomNick();
    lsSet('oneline-name', nm);
    submitRun(nm, sec);
  };
  inp.onkeydown = function(e){ if (e.key === 'Enter') go.onclick(); };
  row.appendChild(inp); row.appendChild(go);
  sec.appendChild(row);
  sec.appendChild(el('div','hint','점수는 서버가 둔 수를 처음부터 다시 돌려 직접 계산합니다.'));
  return sec;
}
function submitRun(name, sec){
  if (S.submitted) return;
  S.submitted = true;
  sec.innerHTML = '';
  sec.appendChild(el('div','hint','순위에 올리는 중…'));
  rankFetch('/api/submit', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ rules: E.RULES, day: S.day, pid: myPid(), name: name, moves: S.moves })
  }).then(function(b){
    sec.innerHTML = '';
    var head = el('div','msg');
    head.innerHTML = b.recorded
      ? '<em>' + b.mine.rank + '위</em> — 오늘 ' + b.count + '명 중'
      : '오늘은 이미 올린 판이 있습니다. 그 기록이 <em>' + b.mine.rank + '위</em>입니다.';
    sec.appendChild(head);
    sec.appendChild(rankTable(b));
  }).catch(function(e){
    S.submitted = false;
    sec.innerHTML = '';
    sec.appendChild(el('div','hint','순위 서버에 못 올렸습니다 — ' + e.message));
    var r = el('div','row'); r.style.marginTop = '10px';
    var again = el('button','act ghost','다시 올리기');
    again.onclick = function(){ submitRun(name, sec); };
    r.appendChild(again); sec.appendChild(r);
  });
}
function loadBoard(box, note, day, allTime){
  box.appendChild(el('div','hint','순위 불러오는 중…'));
  var path = allTime ? '/api/best?me=' + myPid() : '/api/top?day=' + (day || E.dayNumber()) + '&me=' + myPid();
  rankFetch(path).then(function(b){
    box.innerHTML = '';
    if (note) box.appendChild(el('div','msg', note));
    box.appendChild(rankTable(b, allTime));
  }).catch(function(e){
    box.innerHTML = '';
    box.appendChild(el('div','hint','순위를 못 불러왔습니다 — ' + e.message));
  });
}
function openRank(){
  var d = document.getElementById('dex'), w = d.querySelector('.wrap');
  w.innerHTML = '';
  var cl = el('button','act ghost close','닫기');
  cl.onclick = function(){ d.classList.remove('on'); };
  w.appendChild(cl);
  w.appendChild(el('h2', null, '순위'));
  var sub = el('div','sub');
  w.appendChild(sub);
  var tabs = el('div','tabs');
  var tToday = el('button', 'on', '오늘 ' + dayLabel(E.dayNumber()));
  var tAll = el('button', null, '역대');
  tabs.appendChild(tToday); tabs.appendChild(tAll);
  w.appendChild(tabs);
  var box = el('div'); w.appendChild(box);
  /* 기록은 날짜가 바뀌어도 지워지지 않는다. 「오늘」은 그날 판끼리, 「역대」는 전부에서
     한 사람당 가장 좋은 판 하나씩 */
  function show(allTime){
    tToday.className = allTime ? '' : 'on';
    tAll.className = allTime ? 'on' : '';
    sub.textContent = allTime
      ? '지금까지 올라온 모든 날의 기록 가운데 한 사람당 가장 좋은 판입니다.'
      : '데일리 #' + E.dayNumber() + ' — 같은 날은 모두 같은 카드가 같은 순서로 나옵니다. 차이는 어디에 뒀느냐뿐입니다.';
    box.innerHTML = '';
    loadBoard(box, null, null, allTime);
  }
  tToday.onclick = function(){ show(false); };
  tAll.onclick = function(){ show(true); };
  show(false);
  d.classList.add('on');
}

// ══════════════════════════════════ 시작 화면
function title(){
  S = { tut:null, daily:false, floor:1, total:0, line:[], phase:'title' };
  document.getElementById('stage').classList.add('idle');
  document.getElementById('line').innerHTML = '';
  document.getElementById('flow').innerHTML = '';
  var p = document.getElementById('panel');
  p.innerHTML = '';
  // 카드 일곱 장이 왼쪽부터 차례로 켜진다 — 값이 줄을 타고 흐르는 그림
  var tl = el('div','tline');
  for (var i = 0; i < 7; i++){
    var c = document.createElement('i');
    c.style.setProperty('--d', (i * .3) + 's');
    c.style.setProperty('--di', (i * .06) + 's');
    tl.appendChild(c);
  }
  p.appendChild(tl);
  var t = el('div','title home');
  t.innerHTML = '<h1>한 줄</h1><p>값 하나가 왼쪽에서 오른쪽으로 흐르며 카드를 통과합니다.<br>' +
    '끝에 남은 값이 그 층의 점수입니다.<br><br>' +
    '<b style="color:var(--fg)">한 번 놓은 카드는 뺄 수 없습니다.</b> 같은 카드도 어느 칸에 있느냐로 값이 갈립니다.</p>';
  p.appendChild(t);
  var r = el('div','row home');
  var tu = el('button','act','튜토리얼');
  tu.onclick = startTut;
  var a = el('button','act ghost','오늘의 판');
  a.onclick = function(){ newGame(true); };
  var b = el('button','act ghost','자유 모드');
  b.onclick = function(){ newGame(false); };
  var dx = el('button','act ghost','카드 목록');
  dx.onclick = openDex;
  var rk = el('button','act ghost','순위');
  rk.onclick = openRank;
  r.appendChild(tu); r.appendChild(a); r.appendChild(b); r.appendChild(rk); r.appendChild(dx);
  [].forEach.call(r.children, function(btn, i){ btn.style.setProperty('--di', (.36 + i * .07) + 's'); });
  p.appendChild(r);
  var h = el('div','hint');
  var rec = readRec();
  h.innerHTML = (rec
      ? '오늘 기록 — <b style="color:var(--fg)">' + rec.floor + '층 통과 · ' +
        fmt(rec.total) + '</b> &nbsp; <span style="font-family:var(--mono)">' +
        rec.line + '</span><br>'
      : '') +
    '오늘의 판은 접속한 모두가 같은 시드로 돕니다 — 나오는 카드도 순서도 같습니다.<br>' +
    '그래서 점수 차이는 오로지 배치 차이입니다.';
  p.appendChild(h);
  document.getElementById('hFloor').textContent = '—';
  document.getElementById('hGoal').textContent  = '—';
  document.getElementById('hTotal').textContent = '—';
  document.getElementById('hLoop').textContent  = '—';
  document.getElementById('hMode').textContent  = '한 줄';
}
title();
</script>
